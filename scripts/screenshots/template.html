<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080" />
    <title>Screenshot frame</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 1080px;
        min-height: 1200px;
        background: #f5f0e8;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        font-weight: 400;
        color: #1a1a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 72px 48px 64px;
      }
      h1 {
        font-size: 48px;
        font-weight: 400;
        line-height: 1.2;
        text-align: center;
        max-width: 920px;
        margin-bottom: 48px;
      }
      .device {
        width: 920px;
        border-radius: 24px;
        overflow: hidden;
        box-shadow:
          0 24px 48px rgba(0, 0, 0, 0.12),
          0 0 0 1px rgba(0, 0, 0, 0.06);
        background: #ebe6dc;
      }
      .device img {
        display: block;
        width: 100%;
        height: auto;
        vertical-align: top;
      }
    </style>
  </head>
  <body>
    <h1>{{HEADLINE}}</h1>
    <div class="device">
      <img src="{{SCREENSHOT_DATA_URL}}" alt="" />
    </div>
  </body>
</html>
