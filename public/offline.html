<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5e8" />
    <title>black & brew — Offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f5e8;
        --fg: #161614;
        --muted: #5c5a52;
        --border: #d8d4c4;
        --offline: #b45309;
        --online: #15803d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #161614;
          --fg: #f7f5e8;
          --muted: #a8a69c;
          --border: #3a3834;
          --offline: #fbbf24;
          --online: #4ade80;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--fg);
        text-align: center;
      }
      main {
        width: min(100%, 22rem);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.5rem;
        background: color-mix(in srgb, var(--bg) 92%, var(--fg));
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin: 0 0 1rem;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: 0.8rem;
        font-weight: 600;
      }
      .status-pill::before {
        content: '';
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: var(--offline);
      }
      .status-pill[data-online='true']::before {
        background: var(--online);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.125rem;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0 0 0.5rem;
        line-height: 1.5;
        color: var(--muted);
        font-size: 0.95rem;
      }
      button {
        margin-top: 1rem;
        width: 100%;
        min-height: 2.75rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--fg);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="connection-status" class="status-pill" role="status" aria-live="polite" data-online="false">
        Offline
      </p>
      <h1>black &amp; brew</h1>
      <p>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</p>
      <p>No internet connection</p>
      <p>หน้านี้ยังไม่ถูกบันทึกไว้ในเครื่อง — เปิดแอปคลังสินค้าก่อนหลุดเน็ตเพื่อแก้ไขและซิงก์ภายหลัง</p>
      <p>This page is not cached yet — open Inventory while online so edits can queue and sync later.</p>
      <button type="button" id="retry">ลองอีกครั้ง / Retry</button>
    </main>
    <script>
      var statusEl = document.getElementById('connection-status');

      function renderConnectionStatus() {
        var online = navigator.onLine;
        statusEl.dataset.online = online ? 'true' : 'false';
        statusEl.textContent = online ? 'Online / ออนไลน์' : 'Offline / ออฟไลน์';
      }

      renderConnectionStatus();
      window.addEventListener('online', function () {
        renderConnectionStatus();
        location.reload();
      });
      window.addEventListener('offline', renderConnectionStatus);

      document.getElementById('retry').addEventListener('click', function () {
        location.reload();
      });
    </script>
  </body>
</html>
